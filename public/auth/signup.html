<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Create VIP Account | ROCHELLE Doorstep Salon</title>
 <meta name="description" content="Join ROCHELLE At-Home Studio to unlock 20% off your premier doorstep salon booking and earn glow loyalty rewards.">
 <link rel="icon" type="image/png" href="../../assets/img/logo.png">

 <!-- TailwindCSS CDN & Config -->
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="../../src/js/tailwind.config.js"></script>

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Alex+Brush&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body class="bg-[#FAF6F4] text-[#1D1818] dark:bg-[#0F0C0D] dark:text-[#F3ECEE] transition-colors duration-300 font-sans-clean flex flex-col min-h-screen">

 <main class="flex-grow flex items-center justify-center py-16 bg-gradient-to-b from-[#EFE5DD] to-[#FAF6F4] dark:from-[#141012] dark:to-[#0F0C0D] px-4">
 <div class="max-w-md w-full bg-white dark:bg-[#1A1517] p-8 sm:p-10 rounded-3xl border border-gray-200 dark:border-zinc-800 shadow-2xl space-y-6">
 
      <!-- Brand Header -->
      <div class="text-center space-y-1">
        <a href="../../index.html" class="inline-flex items-center gap-2.5 group">
          <img src="../../assets/img/logo.png" alt="ROCHELLE Logo" class="h-9 w-auto object-contain transition-transform group-hover:scale-105">
          <div class="flex flex-col text-left">
            <span class="font-serif-luxury text-2xl font-bold tracking-widest text-[#141010] dark:text-white leading-none group-hover:text-[#BD5579] transition">ROCHELLE</span>
            <span class="text-[8px] uppercase tracking-[0.25em] text-[#BD5579] font-bold mt-0.5">At Home Studio</span>
          </div>
        </a>
      </div>

      <!-- Header -->
      <div class="text-center space-y-1.5 pt-1">
        <span class="inline-block text-[10px] font-bold uppercase tracking-widest text-[#BD5579] bg-pink-100 dark:bg-pink-950/60 px-3 py-1 rounded-full">
          JOIN ROCHELLE VIP
        </span>
        <h1 class="font-serif-luxury text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">
          Create Your Account
        </h1>
        <p class="text-xs text-gray-500">Unlock 20% off your premier home booking with code GLOW20.</p>
      </div>

 <!-- Validated Signup Form -->
 <form id="signup-form" onsubmit="window.handleSignupSubmit(event, this);" class="space-y-4">
 <div>
 <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Full Name *</label>
 <input type="text" id="signup-name" required placeholder="e.g. Clara Moreau" class="w-full px-4 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
 </div>

 <div>
 <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Email Address *</label>
 <input type="email" id="signup-email" required placeholder="name@example.com" class="w-full px-4 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
 </div>

 <div>
 <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Phone Number</label>
 <input type="tel" id="signup-phone" placeholder="+1 (310) 555-0199" class="w-full px-4 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
 </div>

 <div>
 <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Create Password *</label>
 <div class="relative">
 <input type="password" id="signup-password" required placeholder="Minimum 6 characters" class="w-full pl-4 pr-11 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
 <button type="button" onclick="window.togglePasswordVisibility('signup-password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#BD5579] transition text-sm">
 <i class="fa-regular fa-eye"></i>
 </button>
 </div>
 </div>

 <div class="flex items-start gap-2 pt-1">
 <input type="checkbox" id="signup-terms" required class="mt-0.5 accent-[#BD5579]">
 <label for="signup-terms" class="text-[11px] text-gray-500 cursor-pointer leading-tight">
 I agree to the <a href="../../public/pages/Terms-of-service.html" class="text-[#BD5579] font-bold hover:underline">Terms of Service</a> & <a href="../../public/pages/Privacy-policy.html" class="text-[#BD5579] font-bold hover:underline">Privacy Policy</a>.
 </label>
 </div>

 <button type="submit" class="w-full bg-[#BD5579] hover:bg-[#A33F62] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest transition shadow-lg flex items-center justify-center gap-2">
 <span>Complete VIP Registration</span>
 <i class="fa-solid fa-arrow-right"></i>
 </button>
 </form>

 <div class="pt-2 border-t border-gray-100 dark:border-zinc-800 text-center">
 <p class="text-xs text-gray-500">
 Already a member? <a href="../../public/auth/login.html" class="text-[#BD5579] font-bold hover:underline">Sign In here</a>
 </p>
 </div>
 </div>
 </main>
 <script src="../../src/js/theme.js"></script>
 <script src="../../src/js/form-validation.js"></script>
</body>
</html>
