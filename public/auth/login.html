<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Client Sign In | ROCHELLE Doorstep Salon</title>
 <meta name="description" content="Sign in to your ROCHELLE client portal to manage doorstep appointments, live track assigned therapists, and view glow points.">
 <link rel="icon" type="image/png" href="../../assets/img/logo.png">

 <!-- TailwindCSS CDN & Config -->
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="../../src/js/tailwind.config.js"></script>

 <!-- Google Fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Alex+Brush&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" href="../../src/css/style.css">
</head>
<body class="bg-[#FAF6F4] text-[#1D1818] dark:bg-[#0F0C0D] dark:text-[#F3ECEE] transition-colors duration-300 font-sans-clean flex flex-col min-h-screen">

 <main class="flex-grow flex items-center justify-center py-16 bg-gradient-to-b from-[#EFE5DD] to-[#FAF6F4] dark:from-[#141012] dark:to-[#0F0C0D] px-4">
 <div class="max-w-md w-full bg-white dark:bg-[#1A1517] p-8 sm:p-10 rounded-3xl border border-gray-200 dark:border-zinc-800 shadow-2xl space-y-6">
      <!-- Brand Header -->
      <div class="text-center space-y-1">
        <a href="../../index.html" class="inline-flex items-center gap-2.5 group">
          <img src="../../assets/img/logo.png" alt="ROCHELLE Logo" class="h-9 w-auto object-contain transition-transform group-hover:scale-105">
          <div class="flex flex-col text-left">
            <span class="font-serif-luxury text-2xl font-bold tracking-widest text-[#141010] dark:text-white leading-none group-hover:text-[#BD5579] transition">ROCHELLE</span>
            <span class="text-[8px] uppercase tracking-[0.25em] text-[#BD5579] font-bold mt-0.5">At Home Studio</span>
          </div>
        </a>
      </div>

      <!-- Header -->
      <div class="text-center space-y-1.5 pt-1">
        <span class="inline-block text-[10px] font-bold uppercase tracking-widest text-[#BD5579] bg-pink-100 dark:bg-pink-950/60 px-3 py-1 rounded-full">
          CLIENT PORTAL
        </span>
        <h1 class="font-serif-luxury text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">
          Welcome Back
        </h1>
        <p class="text-xs text-gray-500">Access your doorstep sessions, live GPS tracking, and glow points.</p>
      </div>

      <!-- Validated Login Form -->
      <form id="login-form" onsubmit="window.handleLoginSubmit(event, this);" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Email Address</label>
          <input type="email" id="login-email" required value="clara.client@rochelle.com" placeholder="name@example.com" class="w-full px-4 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300">Password</label>
            <a href="#" onclick="alert('Password reset link sent to your email.');" class="text-[11px] text-[#BD5579] font-bold hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <input type="password" id="login-password" required value="LuxuryDoorstep2026!" placeholder="Enter password" class="w-full pl-4 pr-11 py-3.5 rounded-xl bg-[#FAF6F4] dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-[#BD5579]">
            <button type="button" onclick="window.togglePasswordVisibility('login-password', this)" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#BD5579] transition text-sm">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

 <div class="flex items-center gap-2">
 <input type="checkbox" id="remember-me" checked class="accent-[#BD5579]">
 <label for="remember-me" class="text-xs text-gray-500 cursor-pointer">Remember this device for 30 days</label>
 </div>

 <button type="submit" class="w-full bg-[#BD5579] hover:bg-[#A33F62] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest transition shadow-lg flex items-center justify-center gap-2">
 <span>Sign In to Dashboard</span>
 <i class="fa-solid fa-arrow-right"></i>
 </button>
 </form>

 <!-- Instant 1-Click Demo Login -->
 <div class="pt-2 border-t border-gray-100 dark:border-zinc-800 space-y-3 text-center">
 

 <p class="text-xs text-gray-500">
 Don't have an account? <a href="../../public/auth/signup.html" class="text-[#BD5579] font-bold hover:underline">Create an account</a>
 </p>
 </div>

 
 </div>
 </main>

 <script src="../../src/js/theme.js"></script>
 <script src="../../src/js/form-validation.js"></script>
</body>
</html>
